server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html, app.js and styles.css are versioned together by each deploy.
    # Without this, nginx sends no Cache-Control and browsers guess at freshness
    # per file, which lets a stale app.js run against a fresh index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
